[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf-library"
dynamic = ["version"]
description = "Shelf: a small library management system used to demonstrate a Jenkins DevOps pipeline"
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/rubyhdr/jenkinsPipeline"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
