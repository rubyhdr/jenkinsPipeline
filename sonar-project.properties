# SonarQube analysis settings (host URL and token are passed in by Jenkins).
sonar.projectKey=shelf
sonar.projectName=Shelf
sonar.sourceEncoding=UTF-8

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Report imports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/junit-*.xml
sonar.python.flake8.reportPaths=reports/flake8.txt

# Static assets and demo seed data are not application logic.
sonar.exclusions=app/static/**
sonar.coverage.exclusions=app/seed.py,app/templates/**,app/static/**
# The test suite repeats similar setup on purpose; don't count it as duplication.
sonar.cpd.exclusions=tests/**,app/seed.py

sonar.qualitygate.wait=false
