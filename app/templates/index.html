{% extends "base.html" %}
{% block title %}Browse{% endblock %}
{% block content %}
<section class="hero">
  <p class="eyebrow">The library, simplified</p>
  <h1>Find your next read.</h1>
  <form class="search" method="get" action="{{ url_for('main.index') }}" role="search" data-live-search>
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="search-input" type="search" name="q" value="{{ q }}" placeholder="Search by title, author, genre or ISBN"
           aria-label="Search books" autocomplete="off" data-testid="search">
    <input type="hidden" name="genre" value="{{ genre }}">
    <label class="toggle">
      <input type="checkbox" name="available" value="1" {{ 'checked' if available }}>
      <span>Available now</span>
    </label>
    <noscript><button class="btn btn-primary" type="submit">Search</button></noscript>
  </form>
  <div class="chips" aria-label="Genres">
    <a class="chip {{ 'chip-active' if not genre }}" href="{{ url_for('main.index', q=q or None) }}" data-genre="">All</a>
    {% for g in genres %}
      <a class="chip {{ 'chip-active' if g == genre }}" href="{{ url_for('main.index', genre=g, q=q or None) }}" data-genre="{{ g }}">{{ g }}</a>
    {% endfor %}
  </div>
</section>

<section id="results" aria-live="polite">
  {% include "_book_grid.html" %}
</section>
{% endblock %}
