# Production environment. Promoted by the Jenkins "Release" stage using the prod-<version> image tag.
name: shelf-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelf
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${IMAGE:-localhost:5005/shelf:prod}
    container_name: library-production
    restart: unless-stopped
    env_file: ./env/production.env
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql+psycopg://shelf:${DB_PASSWORD:-}@db:5432/shelf
    ports:
      - "5000:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [default, devops-net]

volumes:
  db_data:

networks:
  devops-net:
    external: true
