# CI/CD tooling: Jenkins, SonarQube (+ bootstrap), and a local Docker registry for build artefacts.
#   docker compose -f infra/docker-compose.tools.yml up -d --build
name: shelf-tools

services:
  jenkins:
    build: ./jenkins
    container_name: shelf-jenkins
    # Root is needed to use the host Docker socket from inside the container (Docker Desktop).
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      PIPELINE_REPO_URL: ${PIPELINE_REPO_URL:-file:///workspace-src}
      PIPELINE_REPO_CREDENTIALS: ${PIPELINE_REPO_CREDENTIALS:-}
      PIPELINE_BRANCH: ${PIPELINE_BRANCH:-*/main}
      STAGING_SECRET_KEY: ${STAGING_SECRET_KEY:-staging-secret-change-me}
      PROD_SECRET_KEY: ${PROD_SECRET_KEY:-production-secret-change-me}
      SHELF_DB_PASSWORD: ${SHELF_DB_PASSWORD:-shelf-db-password}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GITHUB_USER: ${GITHUB_USER:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - sonar_secrets:/var/sonar:ro
      # Local checkout, used as the pipeline's Git remote until PIPELINE_REPO_URL points at GitHub.
      - ..:/workspace-src:ro
    networks: [devops-net]

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [devops-net]

  sonar-init:
    build: ./sonarqube
    container_name: sonar-init
    depends_on: [sonarqube]
    restart: "no"
    environment:
      SONAR_URL: http://sonarqube:9000
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-Shelf-Sonar-Admin-2026!}
    volumes:
      - sonar_secrets:/var/sonar
    networks: [devops-net]

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - "5005:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks: [devops-net]

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_secrets:
  registry_data:

networks:
  devops-net:
    name: devops-net
