global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: shelf

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: shelf-production
    metrics_path: /metrics
    static_configs:
      - targets: ["library-production:8000"]
        labels: { env: production }

  - job_name: shelf-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["library-staging:8000"]
        labels: { env: staging }

  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets: ["jenkins:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
