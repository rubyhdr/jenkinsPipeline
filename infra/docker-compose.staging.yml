# Staging environment. Deployed by the Jenkins "Deploy" stage:
#   IMAGE=localhost:5005/shelf:1.0.7 SECRET_KEY=... DB_PASSWORD=... \
#   docker compose -p shelf-staging -f infra/docker-compose.staging.yml up -d --wait
name: shelf-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelf
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${IMAGE:?IMAGE is required}
    container_name: library-staging
    restart: unless-stopped
    env_file: ./env/staging.env
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+psycopg://shelf:${DB_PASSWORD}@db:5432/shelf
    ports:
      - "5001:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m
    networks: [default, devops-net]

volumes:
  db_data:

networks:
  devops-net:
    external: true
